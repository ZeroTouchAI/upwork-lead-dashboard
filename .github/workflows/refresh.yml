name: Refresh Upwork lead data

on:
  schedule:
    # GitHub's scheduler can run these anywhere from on-time to a few hours late,
    # so no time-of-day gating here anymore -- whenever this fires, it just refreshes.
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Rebuild data.json from Google Sheet
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.LEADS_SHEET_ID }}
        run: python scripts/refresh_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "lead-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Automated data refresh"
          git push
