name: Refresh Upwork lead data

on:
  schedule:
    # Every 3 hours. GitHub can start these late; the scraper looks back 24h and
    # dedupes, so a late or skipped run just catches up on the next one.
    - cron: '15 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Upwork via Apify and rebuild data.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/refresh_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "lead-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Automated data refresh"
          git push
