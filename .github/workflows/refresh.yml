name: Refresh Upwork lead data

on:
  schedule:
    # Every 4 hours: sized to stay under the $5/month Apify allowance (see MAX_RESULTS in
    # scripts/refresh_data.py). Each run looks back to the last good run, so late starts catch up.
    - cron: '15 */4 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test alert email with the current best leads (no scraping)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Upwork via Apify and rebuild data.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/refresh_data.py ${{ inputs.test_alert && '--migrate --test-alert' || '' }}

      - name: Commit and push if changed
        run: |
          git config user.name "lead-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Automated data refresh"
          git push
